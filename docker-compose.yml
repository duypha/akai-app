version: '3.8'

services:
  akai:
    build: .
    container_name: akai
    ports:
      - "3000:8000"    # HTTP: http://5.78.148.49
      - "3001:8000"  # WebSocket: ws://5.78.148.49:8000/ws/...
    env_file:
      - .env
    volumes:
      - akai-data:/app/backend/data  # Persist SQLite database
    restart: unless-stopped

volumes:
  akai-data:
    driver: local
